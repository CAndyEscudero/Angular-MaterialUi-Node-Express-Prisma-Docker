<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <img src="/logo.png" alt="Logo" class="login-logo" />
    </div>
    <h1 class="login-title">Sistema de Gestión Universitaria</h1>
    <p class="login-subtitle">Iniciá sesión para continuar</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          required
          class="form-input"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          placeholder="Ingrese su contraseña"
          required
          class="form-input"
          autocomplete="current-password"
        />
      </div>

      <div *ngIf="mensajeError" class="alert alert-error">
        {{ mensajeError }}
      </div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
