<div class="create-form">
  <h3>Crear Usuario</h3>
  <div class="form-row">
    <div class="form-group">
      <label for="user-nombre">Nombre</label>
      <input
        id="user-nombre"
        type="text"
        [(ngModel)]="modelo.nombre"
        placeholder="Nombre completo"
      />
    </div>
    <div class="form-group">
      <label for="user-email">Email</label>
      <input
        id="user-email"
        type="email"
        [(ngModel)]="modelo.email"
        placeholder="email@ejemplo.com"
      />
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="user-password">Contraseña</label>
      <input
        id="user-password"
        type="password"
        [(ngModel)]="modelo.contrasena"
        placeholder="Mínimo 6 caracteres"
      />
    </div>
    <div class="form-group">
      <label for="user-rol">Rol</label>
      <select id="user-rol" [(ngModel)]="modelo.rol">
        <option value="alumno">Alumno</option>
        <option value="profesor">Profesor</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>
  <p class="error-msg" *ngIf="mensajeError">{{ mensajeError }}</p>
  <button class="btn btn-primary" (click)="guardar.emit()">Guardar</button>
</div>
