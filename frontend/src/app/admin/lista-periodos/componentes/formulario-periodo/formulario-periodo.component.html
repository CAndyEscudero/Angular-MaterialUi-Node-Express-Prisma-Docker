<div class="create-form">
  <h3>{{ editandoId ? 'Editar Período' : 'Crear Período' }}</h3>

  <div class="form-row">
    <div class="form-group">
      <label for="per-nombre">Nombre del Período</label>
      <input
        id="per-nombre"
        type="text"
        [(ngModel)]="nombre"
        placeholder="Ej: Inscripciones 1er Cuatrimestre 2026"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="per-inicio">Fecha Inicio</label>
      <input
        id="per-inicio"
        type="date"
        [(ngModel)]="fechaInicio"
      />
    </div>
    <div class="form-group">
      <label for="per-fin">Fecha Fin</label>
      <input
        id="per-fin"
        type="date"
        [(ngModel)]="fechaFin"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="per-cuatrimestre">Cuatrimestre</label>
      <select id="per-cuatrimestre" [(ngModel)]="cuatrimestre">
        <option [ngValue]="null">— Sin especificar —</option>
        <option [ngValue]="1">1° Cuatrimestre</option>
        <option [ngValue]="2">2° Cuatrimestre</option>
      </select>
    </div>
    <div class="form-group">
      <label for="per-anio">Año Académico</label>
      <input
        id="per-anio"
        type="number"
        [(ngModel)]="anioAcademico"
        min="2020"
        max="2035"
        placeholder="Ej: 2026"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group form-group-checkbox">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="activo" />
        <span>Período activo</span>
      </label>
    </div>
  </div>

  <p class="error-msg" *ngIf="mensajeError">{{ mensajeError }}</p>
  <button
    class="btn btn-primary"
    (click)="onSubmit()"
    [disabled]="!nombre || !fechaInicio || !fechaFin"
  >
    {{ editandoId ? 'Actualizar' : 'Guardar' }}
  </button>
</div>
